name: PR Reopen Reassignment
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Required to update stale fork PRs; the workflow runs trusted bot code only.
    types: [reopened]
  issue_comment: # zizmor: ignore[dangerous-triggers] Required for PR-author recovery comments; the bot verifies the author before writes.
    types: [created]
permissions: {}
concurrency:
  group: bot-autoassign-pr-reopen-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  reassign-on-reopen:
    if: >
      github.repository == 'openwisp/openwisp-users' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'reopened'
    permissions:
      contents: read
    uses: openwisp/openwisp-utils/.github/workflows/reusable-bot-autoassign.yml@0bd0c3190d6081ec776baa96d73d8a8a3e059a73 # master
    with:
      bot_command: pr_reopen
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
  handle-pr-activity:
    if: >
      github.repository == 'openwisp/openwisp-users' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.user.login == github.event.comment.user.login
    permissions:
      contents: read
    uses: openwisp/openwisp-utils/.github/workflows/reusable-bot-autoassign.yml@0bd0c3190d6081ec776baa96d73d8a8a3e059a73 # master
    with:
      bot_command: pr_reopen
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
