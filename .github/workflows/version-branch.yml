name: Replicate Commits to Version Branch

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  version-branch:
    if: github.repository == 'openwisp/openwisp-users'
    uses: openwisp/openwisp-actions/.github/workflows/reusable-version-branch.yml@5072c81386b436b073b67bc7918cec647f9e3414 # 0.1.0
    with:
      module_name: openwisp_users
      client_id: ${{ vars.OPENWISP_BOT_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
