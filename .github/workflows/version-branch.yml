name: Replicate Commits to Version Branch

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  version-branch:
    if: github.repository == 'openwisp/openwisp-users'
    uses: openwisp/openwisp-utils/.github/workflows/reusable-version-branch.yml@0bd0c3190d6081ec776baa96d73d8a8a3e059a73 # master
    with:
      module_name: openwisp_users
      client_id: ${{ vars.OPENWISP_BOT_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
