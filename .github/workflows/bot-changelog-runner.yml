name: Changelog Bot Runner

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Privileged follow-up consumes only validated metadata from the trusted review workflow.
    workflows: ["Changelog Bot Trigger"]
    types:
      - completed

permissions: {}

jobs:
  fetch-metadata:
    name: Fetch PR metadata
    runs-on: ubuntu-latest
    if: >
      github.repository == 'openwisp/openwisp-users' &&
      github.event.workflow_run.name == 'Changelog Bot Trigger' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: changelog-runner-fetch-${{ github.repository }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    permissions:
      actions: read # Downloads the metadata artifact from the triggering workflow run.
      pull-requests: read # Resolves the PR associated with the triggering commit.
    outputs:
      pr_number: ${{ steps.metadata.outputs.pr_number }}
    steps:
      - name: Download PR metadata
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: changelog-metadata
          path: ${{ runner.temp }}/changelog-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Resolve triggering pull request
        id: association
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY/commits/$HEAD_SHA/pulls?per_page=100")
          mapfile -t PR_NUMBERS < <(jq -r '.[].number' <<< "$RESPONSE")
          if [ "${#PR_NUMBERS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one pull request for the triggering commit"
            exit 1
          fi
          PR_NUMBER=${PR_NUMBERS[0]}
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid associated PR number: $PR_NUMBER"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Verify current eligible approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.association.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          HEAD_SHA=$(jq -er '.head.sha' <<< "$PR")
          REVIEWS=$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")
          if ! jq -e --arg head_sha "$HEAD_SHA" '
            .[][] | select(
              .state == "APPROVED" and
              .commit_id == $head_sha and
              (.author_association == "OWNER" or
               .author_association == "MEMBER" or
               .author_association == "COLLABORATOR")
            )
          ' <<< "$REVIEWS" > /dev/null; then
            echo "::error::The pull request has no current eligible approval"
            exit 1
          fi

      - name: Read PR metadata
        if: steps.download.outcome == 'success'
        id: metadata
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/changelog-metadata
          EXPECTED_PR_NUMBER: ${{ steps.association.outputs.number }}
        run: |
          PR_NUMBER_FILE="$ARTIFACT_DIR/pr_number"
          if [ ! -d "$ARTIFACT_DIR" ] || [ -L "$ARTIFACT_DIR" ]; then
            echo "::error::Invalid metadata artifact directory"
            exit 1
          fi
          mapfile -d '' ARTIFACT_FILES < <(find "$ARTIFACT_DIR" -mindepth 1 -maxdepth 1 -print0)
          if [ "${#ARTIFACT_FILES[@]}" -ne 1 ] || [ "${ARTIFACT_FILES[0]}" != "$PR_NUMBER_FILE" ] || [ -L "$PR_NUMBER_FILE" ] || [ ! -f "$PR_NUMBER_FILE" ]; then
            echo "::error::Metadata artifact must contain only a regular pr_number file"
            exit 1
          fi
          FILE_SIZE=$(stat -c %s "$PR_NUMBER_FILE")
          if [ "$FILE_SIZE" -gt 16 ]; then
            echo "::error::Metadata artifact is too large"
            exit 1
          fi
          PR_NUMBER=$(< "$PR_NUMBER_FILE")
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          if [ -z "$EXPECTED_PR_NUMBER" ] || [ "$PR_NUMBER" != "$EXPECTED_PR_NUMBER" ]; then
            echo "::error::Metadata PR number does not match the triggering pull request"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  changelog:
    needs: fetch-metadata
    if: >
      github.repository == 'openwisp/openwisp-users' &&
      needs.fetch-metadata.outputs.pr_number != ''
    concurrency:
      group: changelog-runner-${{ github.repository }}-${{ needs.fetch-metadata.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-changelog.yml@5072c81386b436b073b67bc7918cec647f9e3414 # 0.1.0
    with:
      pr_number: ${{ needs.fetch-metadata.outputs.pr_number }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
