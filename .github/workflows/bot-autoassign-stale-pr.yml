name: Stale PR Management
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: bot-autoassign-stale-pr-${{ github.repository }}
  cancel-in-progress: false
jobs:
  manage-stale-prs-python:
    if: github.repository == 'openwisp/openwisp-users'
    permissions:
      contents: read
    uses: openwisp/openwisp-utils/.github/workflows/reusable-bot-autoassign.yml@0bd0c3190d6081ec776baa96d73d8a8a3e059a73 # master
    with:
      bot_command: stale_pr
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
